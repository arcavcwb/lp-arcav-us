name: Validar flujo Claude

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # El id "validate" y la matriz generan los checks requeridos en main:
  # validate (3.10), validate (3.11) y validate (3.12). No los renombres.
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Node >= 22.18 elimina los tipos de .ts de forma nativa, que es lo que
      # necesita tests/contact.test.mjs para importar src/lib/contact*.ts.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar estructura del flujo
        run: |
          python3 scripts/validate_squad.py

      - name: Ejecutar tests
        run: |
          python3 -m unittest discover tests -v

      - name: Ejecutar tests del endpoint de contacto
        run: |
          node --test tests/contact.test.mjs
