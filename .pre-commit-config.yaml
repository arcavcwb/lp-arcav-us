repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: validar-flujo-claude
        name: Validar flujo Claude Code
        entry: python3 scripts/validate_squad.py
        language: system
        pass_filenames: false
        always_run: true

      - id: tests-flujo-claude
        name: Tests del tooling del flujo Claude Code
        entry: python3 -m unittest discover tests -v
        language: system
        pass_filenames: false
        always_run: true

      - id: tests-contacto
        name: Tests del endpoint de contacto (node --test)
        entry: node --test tests/contact.test.mjs
        language: system
        pass_filenames: false
        always_run: true
